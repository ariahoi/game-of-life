<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Игра «Жизнь» Конвея</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05060a; color: #e6e9f2;
    font: 13px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #view { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; cursor: crosshair; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<script id="life-engine">
(() => {
  'use strict';

  // "B3/S23" -> { birth, survive }: 9-битные маски, бит n = «n соседей».
  function parseRule(str) {
    const m = /^B([0-8]*)\/S([0-8]*)$/i.exec(String(str).trim());
    if (!m) throw new Error(`Неверное правило: «${str}». Формат: B3/S23`);
    const mask = (digits) => [...digits].reduce((acc, d) => acc | (1 << +d), 0);
    return { birth: mask(m[1]), survive: mask(m[2]) };
  }

  const maskToDigits = (mask) => {
    let s = '';
    for (let n = 0; n <= 8; n++) if (mask & (1 << n)) s += n;
    return s;
  };

  const TRAIL_DECAY = 16;

  class Life {
    constructor(width, height, rule = 'B3/S23') {
      this._alloc(width, height);
      this.generation = 0;
      this.population = 0;
      this.setRule(rule);
    }

    _alloc(width, height) {
      this.width = width;
      this.height = height;
      const size = width * height;
      this.cells = new Uint8Array(size);
      this.next = new Uint8Array(size);
      this.age = new Uint8Array(size);
      this.trail = new Uint8Array(size);
      // Соседние столбцы с оборачиванием (тор) — чтобы не считать % в горячем цикле.
      this._xm = new Int32Array(width);
      this._xp = new Int32Array(width);
      for (let x = 0; x < width; x++) {
        this._xm[x] = (x - 1 + width) % width;
        this._xp[x] = (x + 1) % width;
      }
    }

    setRule(str) {
      const { birth, survive } = parseRule(str); // бросает — правило не меняется
      this.birth = birth;
      this.survive = survive;
      this.rule = `B${maskToDigits(birth)}/S${maskToDigits(survive)}`;
    }

    _index(x, y) {
      const W = this.width, H = this.height;
      return (((y % H) + H) % H) * W + (((x % W) + W) % W);
    }

    get(x, y) {
      return this.cells[this._index(x, y)];
    }

    set(x, y, alive) {
      const i = this._index(x, y);
      const v = alive ? 1 : 0;
      if (this.cells[i] !== v) this.population += v ? 1 : -1;
      this.cells[i] = v;
      this.age[i] = v;
      this.trail[i] = 0;
    }

    step() {
      const W = this.width, H = this.height;
      const c = this.cells, n = this.next, age = this.age, trail = this.trail;
      const xm = this._xm, xp = this._xp;
      const birth = this.birth, survive = this.survive;
      let pop = 0;
      for (let y = 0; y < H; y++) {
        const rowM = ((y - 1 + H) % H) * W;
        const row0 = y * W;
        const rowP = ((y + 1) % H) * W;
        for (let x = 0; x < W; x++) {
          const a = xm[x], b = xp[x];
          const cnt =
            c[rowM + a] + c[rowM + x] + c[rowM + b] +
            c[row0 + a] + c[row0 + b] +
            c[rowP + a] + c[rowP + x] + c[rowP + b];
          const i = row0 + x;
          const was = c[i];
          const now = ((was ? survive : birth) >> cnt) & 1;
          n[i] = now;
          if (now) {
            age[i] = was ? (age[i] < 255 ? age[i] + 1 : 255) : 1;
            trail[i] = 0;
            pop++;
          } else {
            age[i] = 0;
            trail[i] = was ? 255 : (trail[i] > TRAIL_DECAY ? trail[i] - TRAIL_DECAY : 0);
          }
        }
      }
      this.cells = n;
      this.next = c;
      this.population = pop;
      this.generation++;
    }

    clear() {
      this.cells.fill(0);
      this.age.fill(0);
      this.trail.fill(0);
      this.population = 0;
      this.generation = 0;
    }

    randomize(density, rng = Math.random) {
      const c = this.cells, age = this.age;
      let pop = 0;
      for (let i = 0; i < c.length; i++) {
        const v = rng() < density ? 1 : 0;
        c[i] = v;
        age[i] = v;
        pop += v;
      }
      this.trail.fill(0);
      this.population = pop;
      this.generation = 0;
    }

    // Переносит содержимое в центр нового поля, не влезшее обрезается.
    resize(newW, newH) {
      const oW = this.width, oH = this.height;
      const oc = this.cells, oa = this.age, ot = this.trail;
      this._alloc(newW, newH);
      const dx = Math.floor((newW - oW) / 2);
      const dy = Math.floor((newH - oH) / 2);
      let pop = 0;
      for (let y = 0; y < oH; y++) {
        const ny = y + dy;
        if (ny < 0 || ny >= newH) continue;
        for (let x = 0; x < oW; x++) {
          const nx = x + dx;
          if (nx < 0 || nx >= newW) continue;
          const oi = y * oW + x, ni = ny * newW + nx;
          this.cells[ni] = oc[oi];
          this.age[ni] = oa[oi];
          this.trail[ni] = ot[oi];
          pop += oc[oi];
        }
      }
      this.population = pop;
    }
  }

  globalThis.LifeEngine = { parseRule, Life, TRAIL_DECAY };
})();
</script>
<script id="view-math">
(() => {
  'use strict';
  // Камера: { x, y } — координата клетки в центре экрана (дробная), zoom — экранных px на клетку.
  const MIN_ZOOM = 0.5, MAX_ZOOM = 64;
  const MAX_ACC = 0.25, MAX_STEPS = 8;
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

  function screenToCell(cam, sx, sy, vw, vh, W, H) {
    const x = Math.floor(cam.x + (sx - vw / 2) / cam.zoom);
    const y = Math.floor(cam.y + (sy - vh / 2) / cam.zoom);
    if (x < 0 || y < 0 || x >= W || y >= H) return null;
    return { x, y };
  }

  function cellToScreen(cam, cx, cy, vw, vh) {
    return { x: (cx - cam.x) * cam.zoom + vw / 2, y: (cy - cam.y) * cam.zoom + vh / 2 };
  }

  function zoomAt(cam, sx, sy, factor, vw, vh) {
    const ox = sx - vw / 2, oy = sy - vh / 2;
    const wx = cam.x + ox / cam.zoom, wy = cam.y + oy / cam.zoom;
    const zoom = clamp(cam.zoom * factor, MIN_ZOOM, MAX_ZOOM);
    return { x: wx - ox / zoom, y: wy - oy / zoom, zoom };
  }

  function fitCamera(W, H, vw, vh) {
    return { x: W / 2, y: H / 2, zoom: clamp(Math.min(vw / W, vh / H) * 0.95, MIN_ZOOM, MAX_ZOOM) };
  }

  // Брезенхем: все клетки отрезка, включая оба конца.
  function lineCells(x0, y0, x1, y1) {
    const out = [];
    const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0);
    const sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
    let err = dx + dy;
    for (;;) {
      out.push([x0, y0]);
      if (x0 === x1 && y0 === y1) break;
      const e2 = 2 * err;
      if (e2 >= dy) { err += dy; x0 += sx; }
      if (e2 <= dx) { err += dx; y0 += sy; }
    }
    return out;
  }

  // Сколько поколений посчитать в этом кадре при скорости speed пок./с.
  function stepsForFrame(acc, dt, speed) {
    const a = Math.min(acc + dt, MAX_ACC);
    const steps = Math.floor(a * speed + 1e-9);
    if (steps > MAX_STEPS) return { steps: MAX_STEPS, acc: 0 };
    return { steps, acc: Math.max(0, a - steps / speed) };
  }

  globalThis.ViewMath = { MIN_ZOOM, MAX_ZOOM, screenToCell, cellToScreen, zoomAt, fitCamera, lineCells, stepsForFrame };
})();
</script>
<script id="app">
(() => {
  'use strict';
  const { Life } = LifeEngine;
  const VM = ViewMath;

  // ---------- Состояние ----------
  const app = {
    life: new Life(400, 300),
    cam: { x: 200, y: 150, zoom: 1 },
    running: false,
    speed: 15,
    trails: true,
    density: 0.25,
    vw: innerWidth,
    vh: innerHeight,
  };
  window.app = app;

  // ---------- Renderer ----------
  const canvas = document.getElementById('view');
  const ctx = canvas.getContext('2d');
  const FIELD_BG = [0x0a, 0x0c, 0x14];
  const OUTSIDE_BG = '#05060a';
  const rgba = (r, g, b) => (255 << 24 | b << 16 | g << 8 | r) >>> 0; // little-endian RGBA в Uint32
  const lerp = (a, b, t) => Math.round(a + (b - a) * t);
  const mix = (c1, c2, t) => [0, 1, 2].map((k) => lerp(c1[k], c2[k], t));

  // Цвет живой клетки по возрасту: молодая почти белая → бирюза → глубокий фиолетовый.
  const YOUNG = [0xe8, 0xf8, 0xff], MID = [0x2e, 0xe6, 0xc8], OLD = [0x6a, 0x2b, 0xd9];
  const ageLUT = new Uint32Array(256);
  for (let a = 0; a < 256; a++) {
    const c = a <= 20 ? mix(YOUNG, MID, Math.max(0, a - 1) / 19)
            : a <= 100 ? mix(MID, OLD, (a - 20) / 80) : OLD;
    ageLUT[a] = rgba(...c);
  }
  // След: фиолетовый поверх фона с непрозрачностью до 0.45.
  const trailLUT = new Uint32Array(256);
  for (let t = 0; t < 256; t++) trailLUT[t] = rgba(...mix(FIELD_BG, OLD, (t / 255) * 0.45));
  const BG_PIX = rgba(...FIELD_BG);

  let off = null, offCtx = null, img = null, pix = null;
  function ensureBuffer() {
    const { width: W, height: H } = app.life;
    if (off && off.width === W && off.height === H) return;
    off = document.createElement('canvas');
    off.width = W; off.height = H;
    offCtx = off.getContext('2d');
    img = offCtx.createImageData(W, H);
    pix = new Uint32Array(img.data.buffer);
  }

  function render() {
    ensureBuffer();
    const { cells, age, trail, width: W, height: H } = app.life;
    const trails = app.trails;
    for (let i = 0; i < cells.length; i++) {
      pix[i] = cells[i] ? ageLUT[age[i]] : (trails && trail[i]) ? trailLUT[trail[i]] : BG_PIX;
    }
    offCtx.putImageData(img, 0, 0);

    const dpr = devicePixelRatio || 1;
    const { cam, vw, vh } = app;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = OUTSIDE_BG;
    ctx.fillRect(0, 0, vw, vh);
    ctx.imageSmoothingEnabled = false;
    const p = VM.cellToScreen(cam, 0, 0, vw, vh);
    ctx.drawImage(off, p.x, p.y, W * cam.zoom, H * cam.zoom);

    if (cam.zoom >= 8) drawGrid(p, W, H);
  }

  function drawGrid(origin, W, H) {
    const { cam, vw, vh } = app;
    const z = cam.zoom;
    const x0 = Math.max(0, Math.floor(-origin.x / z)), x1 = Math.min(W, Math.ceil((vw - origin.x) / z));
    const y0 = Math.max(0, Math.floor(-origin.y / z)), y1 = Math.min(H, Math.ceil((vh - origin.y) / z));
    ctx.beginPath();
    for (let x = x0; x <= x1; x++) {
      const sx = Math.round(origin.x + x * z) + 0.5;
      ctx.moveTo(sx, origin.y + y0 * z); ctx.lineTo(sx, origin.y + y1 * z);
    }
    for (let y = y0; y <= y1; y++) {
      const sy = Math.round(origin.y + y * z) + 0.5;
      ctx.moveTo(origin.x + x0 * z, sy); ctx.lineTo(origin.x + x1 * z, sy);
    }
    ctx.strokeStyle = 'rgba(255,255,255,0.06)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  function resizeCanvas() {
    const dpr = devicePixelRatio || 1;
    app.vw = innerWidth; app.vh = innerHeight;
    canvas.width = Math.round(app.vw * dpr);
    canvas.height = Math.round(app.vh * dpr);
    // Камера хранит центр, поэтому при смене размера окна центр сохраняется сам.
  }

  function fit() {
    app.cam = VM.fitCamera(app.life.width, app.life.height, app.vw, app.vh);
  }

  // ---------- Цикл ----------
  let last = performance.now(), acc = 0;
  function frame(t) {
    const dt = Math.max(0, (t - last) / 1000);
    last = t;
    if (app.running) {
      const r = VM.stepsForFrame(acc, dt, app.speed);
      acc = r.acc;
      for (let i = 0; i < r.steps; i++) app.life.step();
    } else {
      acc = 0;
    }
    app.onFrame?.();
    render();
    requestAnimationFrame(frame);
  }

  addEventListener('resize', resizeCanvas);
  Object.assign(app, { render, fit, resizeCanvas });

  // ---------- Старт ----------
  resizeCanvas();
  app.life.randomize(app.density);
  fit();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
